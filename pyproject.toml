[project]
name = "caloriehunter"
version = "1.0.0"
description = "Meal logging web app with LLM-based nutrition estimates"
readme = "README.md"
authors = [
    { name = "J3NZ0L", email = "jeneyzoltan2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "google-genai>=3.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
